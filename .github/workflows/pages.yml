name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Brief pause helps avoid a known race where deploy-pages can't see
      # the just-uploaded github-pages artifact yet ("Found 0 artifact(s)").
      - name: Wait for artifact visibility
        run: sleep 5
      - uses: actions/deploy-pages@v4
        id: deployment
