<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rostom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --night: #070d16;
  --deep: #0b1524;
  --panel: #101c2c;
  --panel-2: #152436;
  --line: rgba(126, 160, 211, 0.14);
  --text: #eef3f8;
  --muted: #8b9aab;
  --aegean: #7ea0d3;
  --aegean-deep: #3d608f;
  --ink-blue: #0a3663;
  --gold: #e8c46a;
  --gold-dim: rgba(232, 196, 106, 0.14);
  --ok: #6bcf9b;
  --bad: #e88a8a;
  --font: "Plus Jakarta Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --radius: 12px;
  --shadow: 0 12px 40px -12px rgba(7, 13, 22, 0.65), 0 4px 16px -4px rgba(10, 54, 99, 0.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--text);
  background:
    radial-gradient(1000px 600px at 15% -5%, rgba(61,96,143,0.35), transparent 55%),
    radial-gradient(800px 500px at 95% 10%, rgba(232,196,106,0.08), transparent 45%),
    linear-gradient(180deg, #0a1422 0%, var(--night) 40%, #060a12 100%);
  min-height:100%;font-size:14px;line-height:1.5;
  padding:calc(18px + var(--safe-top)) 18px calc(48px + var(--safe-bot));
}
body.locked{overflow:hidden;padding:0;background:var(--night)}
body.locked #app-mount{display:none!important}
body.locked #unlock-overlay{display:flex!important}
body:not(.locked) #unlock-overlay{display:none!important}

#unlock-overlay{
  position:fixed;inset:0;z-index:2147483647;display:none;
  align-items:center;justify-content:center;
  background:
    radial-gradient(700px 420px at 40% 30%, rgba(61,96,143,0.4), transparent),
    var(--night);
  isolation:isolate;
}
.unlock-card{
  width:min(420px,92vw);background:rgba(16,28,44,0.92);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  backdrop-filter:blur(16px);
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
}
.unlock-stripe{height:3px;background:linear-gradient(90deg,var(--aegean),var(--gold))}
.unlock-inner{padding:28px 26px 26px}
.unlock-brand{
  font-weight:700;font-size:clamp(34px,8vw,44px);
  letter-spacing:-0.04em;line-height:.95;margin-bottom:10px;
  background:linear-gradient(135deg,#fff 30%,var(--aegean));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.unlock-card p{color:var(--muted);font-size:13px;margin-bottom:18px;max-width:34em}
.unlock-card label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:500}
.unlock-card input[type=password]{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--deep);color:var(--text);font:500 14px/1.2 var(--mono);margin-bottom:12px;
}
.unlock-card input[type=password]:focus{outline:none;border-color:var(--aegean);box-shadow:0 0 0 3px rgba(126,160,211,.15)}
.unlock-card .row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px;cursor:pointer}
.unlock-err{min-height:18px;color:var(--bad);font-size:12px;margin-bottom:8px}
.unlock-card button{
  width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer;
  background:var(--aegean);color:var(--night);font:600 14px/1 var(--font);
}
.unlock-card button:hover{background:#95b4e0}

.shell{position:relative;z-index:1;max-width:960px;margin:0 auto}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:12px;animation:fade .4s ease both;
}
.topbar-meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--line);background:rgba(16,28,44,0.55);color:var(--text);
  padding:9px 13px;border-radius:10px;font:600 12px/1 var(--font);
  cursor:pointer;transition:background .15s,border-color .15s,transform .15s;
  backdrop-filter:blur(8px);
}
.btn:hover{background:var(--panel-2);border-color:rgba(126,160,211,.35)}
.btn-primary{background:var(--aegean);color:var(--night);border-color:transparent}
.btn-primary:hover{background:#95b4e0}
.btn.refreshing{opacity:.5;pointer-events:none}
.tog-wrap{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:500}
.tog{position:relative;width:34px;height:18px}
.tog input{opacity:0;position:absolute;width:0;height:0}
.tog-sl{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:.2s}
.tog-sl::before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:.2s}
.tog input:checked+.tog-sl{background:var(--aegean-deep);border-color:var(--aegean)}
.tog input:checked+.tog-sl::before{transform:translateX(14px);background:#fff}
.status-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;min-height:24px}
.pill{
  font-size:11px;padding:4px 10px;border-radius:999px;font-weight:600;
  border:1px solid var(--line);color:var(--muted);background:rgba(16,28,44,.5)
}
.pill-ok{color:var(--ok);border-color:rgba(107,207,155,.3);background:rgba(107,207,155,.08)}
.pill-err{color:var(--bad);border-color:rgba(232,138,138,.3);background:rgba(232,138,138,.08)}
.pill-load{color:var(--gold);border-color:rgba(232,196,106,.3);background:var(--gold-dim)}

.hero{
  position:relative;margin:0 0 36px;min-height:min(72vh,580px);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:36px 28px 32px;overflow:hidden;border-radius:18px;
  background:
    linear-gradient(165deg, rgba(126,160,211,0.18) 0%, transparent 42%),
    linear-gradient(205deg, #163154 0%, #0c1a2e 48%, #081018 100%);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  animation:rise .65s cubic-bezier(.2,.8,.2,1) both;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 78% 20%, rgba(232,196,106,0.12), transparent 50%),
    radial-gradient(ellipse at 20% 80%, rgba(126,160,211,0.15), transparent 45%);
  animation:drift 16s ease-in-out infinite alternate;
}
.hero-atmosphere{display:none}
.hero-brand{
  position:relative;z-index:1;font-weight:700;
  font-size:clamp(56px,14vw,108px);letter-spacing:-0.045em;line-height:.88;
  margin-bottom:18px;color:#fff;
}
.hero-kicker{
  position:relative;z-index:1;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(238,243,248,.65);margin-bottom:8px;font-weight:600;
}
.hero-amount{
  position:relative;z-index:1;font-family:var(--mono);font-weight:600;
  font-size:clamp(36px,7vw,52px);letter-spacing:-0.03em;color:var(--gold);margin-bottom:12px;
}
.hero-support{position:relative;z-index:1;max-width:40em;color:rgba(238,243,248,.78);font-size:14px;margin-bottom:18px}
.hero-split{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px 20px;margin-bottom:20px}
.hero-split > div{
  min-width:108px;padding:10px 14px;border-radius:12px;
  background:rgba(7,13,22,0.35);border:1px solid rgba(126,160,211,0.16);
}
.hero-split span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero-split strong{display:block;margin-top:4px;font-family:var(--mono);font-size:17px;font-weight:600;color:#fff}
.hero-cta{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap}

.section{margin-bottom:48px;animation:fade .5s ease both}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{font-size:clamp(22px,4vw,28px);font-weight:700;letter-spacing:-0.03em}
.section-head p{color:var(--muted);font-size:13px;max-width:36em}
.month-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}
@media(max-width:740px){.month-grid{grid-template-columns:1fr}}
.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  padding:16px;border-radius:var(--radius);border:1px solid var(--line);
  background:rgba(16,28,44,0.72);box-shadow:var(--shadow);
}
.stat-pair + .stat{margin-top:10px}
.stat-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat-val{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-0.02em}
.stat-val.pos{color:var(--ok)}.stat-val.neg{color:var(--bad)}
.cat-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.cat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.cat-track{height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.cat-fill{height:100%;background:linear-gradient(90deg,var(--aegean-deep),var(--aegean));border-radius:99px}
.cat-amt{text-align:right;font-family:var(--mono);font-size:12px}
.inc-breakdown{display:flex;flex-wrap:wrap;gap:8px}
.inc-chip{
  padding:7px 11px;border-radius:10px;border:1px solid var(--line);
  background:rgba(16,28,44,0.72);font-size:12px;color:var(--muted);
}
.inc-chip strong{display:block;margin-top:2px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ok)}
.inc-section-lbl{
  width:100%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:2px 0 0;
}
.feed{border-top:1px solid var(--line)}
.feed-item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed-cat{font-weight:600}
.feed-meta{color:var(--muted);font-size:11px;margin-top:3px;font-family:var(--mono)}
.feed-amt{font-family:var(--mono);font-weight:600;white-space:nowrap}
.feed-amt.inc{color:var(--ok)}.feed-amt.exp{color:var(--text)}
.ai-brief{
  margin:-8px 0 36px;padding:18px 18px;position:relative;border-radius:var(--radius);
  background:rgba(16,28,44,0.72);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:13px;line-height:1.65;color:var(--muted);
}
.ai-brief .ai-tag{
  position:absolute;top:14px;right:40px;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);font-weight:700;
}
.ai-brief .ai-refresh{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px}
.ai-brief b{color:var(--text)}.ai-brief ul{margin:8px 0 0 18px}.ai-loading{font-style:italic}
.chart-wrap{
  position:relative;height:300px;width:100%;margin-bottom:12px;border-radius:var(--radius);
  background:rgba(16,28,44,0.72);border:1px solid var(--line);padding:16px 12px 10px;box-shadow:var(--shadow);
}
.traj-note{font-size:12px;color:var(--muted);max-width:50em}
.traj-toggle{display:inline-flex;gap:4px;margin-bottom:12px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(16,28,44,.6)}
.traj-toggle button{
  border:0;background:transparent;padding:8px 12px;border-radius:9px;
  font:600 11px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;
}
.traj-toggle button.on{background:var(--aegean);color:var(--night)}
.modal-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(7,13,22,.72);align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal{width:min(420px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.modal::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--aegean),var(--gold))}
.modal-pad{padding:22px}
.modal h3{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}
.modal .hint{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.45}
.modal label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.modal input{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--deep);color:var(--text);font:500 13px/1.2 var(--mono);margin-bottom:12px;
}
.modal-actions{display:flex;gap:8px;margin-top:8px}
.modal-actions .btn{flex:1;text-align:center;padding:12px}
.finary-box{margin-bottom:14px;padding:10px 12px;border-radius:10px;border:1px solid rgba(126,160,211,.3);background:rgba(61,96,143,.2);font-size:12px}
.finary-wait{margin-bottom:14px;padding:10px 12px;border-radius:10px;border:1px solid rgba(232,196,106,.3);background:var(--gold-dim);font-size:12px;color:var(--gold)}
body.anon .blur-val,body.anon .hero-amount,body.anon .hero-split strong,body.anon .stat-val,body.anon .cat-amt,body.anon .feed-amt,body.anon .cat-track,body.anon #ai-body,body.anon .chart-wrap{filter:blur(12px)!important;opacity:.15!important;user-select:none!important;pointer-events:none!important}
body.anon .hero-amount{filter:blur(18px)!important;opacity:.1!important}
.spin{display:inline-block;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(1.5%,2%,0) scale(1.03)}}
</style>
</head>
<body class="locked">
<div id="app-mount"></div>
<template id="app-shell-template">
<div id="app-shell" class="shell">
  <div class="topbar">
    <div class="topbar-meta" id="sync-time">Loading…</div>
    <div class="top-actions">
      <label class="tog-wrap" title="Hide amounts">
        <span id="anon-lbl">Anon</span>
        <span class="tog"><input type="checkbox" id="tog-anon" onchange="onAnonToggle()"><span class="tog-sl"></span></span>
      </label>
      <button class="btn" type="button" onclick="showBalanceModal()">Settings</button>
      <button class="btn" type="button" onclick="lockVault()">Lock</button>
      <button class="btn btn-primary" type="button" id="refresh-btn" onclick="refreshAll()">
        <span id="refresh-icon">↻</span> Refresh
      </button>
    </div>
  </div>
  <div class="status-row" id="status-bar"></div>
  <section class="hero" aria-label="Net worth">
    <div class="hero-atmosphere" aria-hidden="true"></div>
    <div class="hero-brand">Rostom</div>
    <div class="hero-kicker">Net worth</div>
    <div class="hero-amount blur-val" id="nw-hero-val">—</div>
    <p class="hero-support" id="hero-support">Unlock to load balances.</p>
    <div class="hero-split" id="hero-split"></div>
    <div class="hero-cta">
      <button class="btn btn-primary" type="button" onclick="refreshAll()">Refresh live data</button>
      <button class="btn" type="button" onclick="document.getElementById('zone-cashflow').scrollIntoView({behavior:'smooth'})">This month</button>
    </div>
  </section>
  <div class="ai-brief" id="ai-box">
    <span class="ai-tag">Brief</span>
    <button type="button" class="ai-refresh" id="ai-refresh-btn" onclick="forceAiRefresh()" title="Regenerate">↻</button>
    <div id="ai-body"><span class="ai-loading">…</span></div>
  </div>
  <section class="section" id="zone-cashflow">
    <div class="section-head">
      <h2>This month</h2>
      <p id="cashflow-sub">Income, spend, and the latest movements.</p>
    </div>
    <div class="month-grid">
      <div>
        <div class="stat-pair">
          <div class="stat"><div class="stat-lbl">Income</div><div class="stat-val pos blur-val" id="stat-inc">—</div></div>
          <div class="stat"><div class="stat-lbl">Spent</div><div class="stat-val blur-val" id="stat-exp">—</div></div>
        </div>
        <div class="stat"><div class="stat-lbl">Net</div><div class="stat-val blur-val" id="stat-net">—</div></div>
        <div id="inc-breakdown" class="inc-breakdown" style="margin-top:14px"></div>
        <div id="cat-bars" style="margin-top:18px"></div>
      </div>
      <div>
        <div class="section-head" style="margin-bottom:8px"><h2 style="font-size:20px">Latest</h2><p id="feed-count"></p></div>
        <div class="feed" id="expense-list"></div>
      </div>
    </div>
  </section>
  <section class="section" id="zone-trajectory">
    <div class="section-head">
      <h2>PEA trajectory</h2>
      <p>Contributions so far, then a simple forward path — gross and net after the 5-year mark (PS on gain).</p>
    </div>
    <div class="traj-toggle" role="group" aria-label="Projection view">
      <button type="button" class="on" id="tog-gross" onclick="setProjMode('gross')">Gross</button>
      <button type="button" id="tog-net" onclick="setProjMode('net')">Net after 5y</button>
      <button type="button" id="tog-both" onclick="setProjMode('both')">Both</button>
    </div>
    <div class="chart-wrap"><canvas id="trajChart"></canvas></div>
    <p class="traj-note" id="traj-note"></p>
  </section>
</div>
<div id="modal-overlay" class="modal-overlay">
  <div class="modal"><div class="modal-pad">
    <h3>Settings</h3>
    <p class="hint">PEA, Livret A and cost basis come from Finary (via sync). Only PEE is manual here.</p>
    <div id="modal-auto-block" class="finary-box" style="display:none"><div id="modal-auto-summary"></div></div>
    <div id="modal-finary-waiting" class="finary-wait" style="display:none">No Finary balances yet. Ask Cursor to sync, then Refresh.</div>
    <label for="modal-pee">PEE (Epsor) €</label>
    <input id="modal-pee" type="number" step="0.01">
    <label for="modal-gemini">Gemini API key (browser only)</label>
    <input id="modal-gemini" type="password" autocomplete="off" placeholder="AIza…">
    <label for="modal-export-url">Apps Script web app URL</label>
    <input id="modal-export-url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    <p class="hint">Needed for live Refresh. Unlock still loads the encrypted vault without it.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" onclick="saveBalancesFromModal()">Save</button>
      <button type="button" class="btn" onclick="hideBalanceModal()">Cancel</button>
    </div>
  </div></div>
</div>
</template>
<div id="unlock-overlay">
  <div class="unlock-card" onclick="event.stopPropagation()">
    <div class="unlock-stripe"></div>
    <div class="unlock-inner">
      <div class="unlock-brand">Rostom</div>
      <p>Dashboard is locked. Enter your passphrase to decrypt the vault on this device.</p>
      <label for="unlock-pass">Passphrase</label>
      <input id="unlock-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitUnlock()">
      <label class="row"><input type="checkbox" id="unlock-remember" checked> Remember this device</label>
      <div class="unlock-err" id="unlock-error"></div>
      <button type="button" id="unlock-btn" onclick="submitUnlock()">Unlock</button>
    </div>
  </div>
</div>

<script>
const LS_SNAPSHOT = 'wallet_snapshot_file_id';
const LS_BALANCES = 'wallet_balances';
const LS_GEMINI = 'gemini_api_key';
const LS_EXPORT_URL = 'wallet_export_webapp_url';
const LS_VAULT_PASS = 'dashboard_vault_pass';
const ENC_SNAPSHOT_URL = './data/wallet-snapshot.enc';

let vaultPass = null;
let vaultUnlocked = false;
let anonMode = localStorage.getItem('dashboard_anon') === '1';
let projMode = 'both';
let aiGenerating = false;
const charts = {};

const STATE = {
  pea: 0, livretA: 0, pee: 0, checking: null,
  monthlyNetIncome: 0, peaMonthly: 0, peaMonthsActive: 0, peaStartedAt: null,
  peaAlloc: [],
  monthlyCostBasis: 0,
  peaContributions: [],
  transactions: [],
  savingsData: [],
  finaryOk: false, driveOk: false, savingsOk: false,
  balancesSource: null, balanceDate: null, lastSnapshotSync: null,
  snapshotFetchError: null, snapshotSource: null,
};

function fmt(v) { return '€' + Math.abs(Math.round(v)).toLocaleString('fr-FR'); }
function fmt2(v) {
  return '€' + Math.abs(Number(v)).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtAxis(v) { return anonMode ? '•••' : fmt(v); }
function fmtTip(label, v) { return anonMode ? '•••' : (label ? label + ': ' + fmt(v) : fmt(v)); }

function yearsHeld(fromIso) {
  if (!fromIso) return 0;
  const start = new Date(fromIso);
  if (isNaN(+start)) return 0;
  return Math.max(0, (Date.now() - start.getTime()) / (365.25 * 86400000));
}

/** Illustrative FR PEA tax on gain only — not legal advice. */
function peaTaxEstimate(value, costBasis, startedAt, asOfYears, { afterFiveYears = false } = {}) {
  const gain = Math.max(0, (value || 0) - (costBasis || 0));
  const years = asOfYears != null ? asOfYears : yearsHeld(startedAt);
  // Default display: net if withdrawn after the 5-year mark (PS 17.2% on gain).
  const rate = afterFiveYears || years >= 5 ? 0.172 : 0.30;
  const tax = gain * rate;
  return {
    value: value || 0,
    costBasis: costBasis || 0,
    gain,
    years,
    rate,
    tax,
    net: (value || 0) - tax,
    regime: rate >= 0.25 ? 'PFU ~30%' : 'PS 17.2%',
  };
}

/** Net PEA assuming withdrawal only after 5 years (PS on gain). */
function peaNetAfter5y(value, costBasis) {
  return peaTaxEstimate(value, costBasis, null, 5, { afterFiveYears: true });
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveVaultKey(passphrase, salt, iterations) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    true,
    ['decrypt', 'encrypt']
  );
}

async function decryptVaultBundle(bundle, passphrase) {
  if (!bundle || bundle.v !== 1 || !bundle.ct) throw new Error('Invalid vault file');
  const salt = b64ToBytes(bundle.salt);
  const iv = b64ToBytes(bundle.iv);
  const tag = b64ToBytes(bundle.tag);
  const ct = b64ToBytes(bundle.ct);
  const combined = new Uint8Array(ct.length + tag.length);
  combined.set(ct, 0);
  combined.set(tag, ct.length);
  const key = await deriveVaultKey(passphrase, salt, bundle.iter || 250000);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

function clearSensitiveState() {
  Object.assign(STATE, {
    pea: 0, livretA: 0, pee: 0, checking: null,
    monthlyNetIncome: 0, peaMonthly: 0, peaMonthsActive: 0, peaStartedAt: null,
    monthlyCostBasis: 0, peaContributions: [], transactions: [], savingsData: [],
    finaryOk: false, driveOk: false, savingsOk: false,
    balancesSource: null, balanceDate: null, lastSnapshotSync: null,
    snapshotFetchError: null, snapshotSource: null,
  });
  Object.keys(charts).forEach(k => { try { charts[k]?.destroy?.(); } catch (_) {} delete charts[k]; });
}

}

function unmountDashboard() {

async function fetchEncryptedSnapshot() {
  const res = await fetch(ENC_SNAPSHOT_URL + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function persistBalancesState() {
  try {
    localStorage.setItem(LS_BALANCES, JSON.stringify({
      pea: STATE.pea, livretA: STATE.livretA, pee: STATE.pee,
      costBasis: STATE.monthlyCostBasis,
      monthlyNetIncome: STATE.monthlyNetIncome,
      peaMonthly: STATE.peaMonthly,
      peaMonthsActive: STATE.peaMonthsActive || undefined,
      peaStartedAt: STATE.peaStartedAt || undefined,
      peaAlloc: STATE.peaAlloc,
      peaContributions: STATE.peaContributions,
      date: STATE.balanceDate || new Date().toISOString(),
      source: STATE.balancesSource || (STATE.finaryOk ? 'finary' : 'manual'),
    }));
  } catch (e) { console.warn('localStorage write:', e); }
}

function derivePeaMonthlyFromFinary() {
  const cb = STATE.monthlyCostBasis;
  if (!(cb > 0)) return;
  let months = STATE.peaMonthsActive > 0 ? STATE.peaMonthsActive : 0;
  if (!months && STATE.peaStartedAt) {
    const start = new Date(STATE.peaStartedAt);
    if (!isNaN(+start)) {
      const now = new Date();
      months = Math.max(1, (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth()) + 1);
    }
  }
  if (!months) months = Math.max(1, Math.round(cb / 700) || 1);
  STATE.peaMonthly = Math.max(0, Math.round(cb / months));
}

function applyBalancesPayload(b, { persist = true } = {}) {
  if (!b || typeof b !== 'object') return false;
  if (b.pea != null) STATE.pea = +b.pea;
  if (b.livretA != null) STATE.livretA = +b.livretA;
  if (b.pee != null) STATE.pee = +b.pee;
  if (b.checking != null) STATE.checking = +b.checking;
  if (b.costBasis != null) STATE.monthlyCostBasis = +b.costBasis;
  if (b.monthlyNetIncome != null) STATE.monthlyNetIncome = +b.monthlyNetIncome;
  if (Array.isArray(b.peaAlloc) && b.peaAlloc.length) STATE.peaAlloc = b.peaAlloc;
  if (b.peaMonthsActive != null) STATE.peaMonthsActive = +b.peaMonthsActive;
  if (b.peaStartedAt) STATE.peaStartedAt = b.peaStartedAt;
  if (Array.isArray(b.peaContributions)) STATE.peaContributions = b.peaContributions;
  STATE.balanceDate = b.updatedAt || b.date || new Date().toISOString();
  STATE.finaryOk = !!(STATE.pea || STATE.livretA);
  STATE.balancesSource = (b.source === 'finary' || STATE.finaryOk) ? 'finary' : (b.source || 'snapshot');
  if (b.peaMonthly != null && +b.peaMonthly > 0) STATE.peaMonthly = +b.peaMonthly;
  else derivePeaMonthlyFromFinary();
  if (persist) persistBalancesState();
  return true;
}

function loadBalancesFromStorage() {
  try {
    const b = JSON.parse(localStorage.getItem(LS_BALANCES) || 'null');
    if (b) applyBalancesPayload(b, { persist: false });
  } catch (e) { console.warn('localStorage:', e); }
}

function applySnapshotData(data) {
  if (!data || !Array.isArray(data.transactions)) throw new Error('Invalid snapshot JSON');
  STATE.transactions = data.transactions.map(t => ({
    date: new Date(t.date), type: t.type, category: t.category,
    amount: parseFloat(t.amount), memo: t.memo || '',
  })).filter(t => !isNaN(t.date) && !isNaN(t.amount))
    .sort((a, b) => b.date - a.date);
  STATE.driveOk = true;
  STATE.lastSnapshotSync = data.lastSync || data.servedAt || null;
  if (data.balances) applyBalancesPayload(data.balances);
}

async function unlockWithPassphrase(passphrase, remember) {
  const bundle = await fetchEncryptedSnapshot();
  const data = await decryptVaultBundle(bundle, passphrase);
  vaultPass = passphrase;
  vaultUnlocked = true;
  if (remember) localStorage.setItem(LS_VAULT_PASS, passphrase);
  else localStorage.removeItem(LS_VAULT_PASS);
  mountDashboard();
  setLockedUI(false);
  loadBalancesFromStorage();
  applySnapshotData(data);
  STATE.snapshotSource = 'vault';
  hideUnlockModal();
  await fetchSavings();
  renderAll(STATE.transactions);
  generateAiSummary(STATE.transactions, false).catch(() => {});
  return true;
}

async function tryUnlockFromDevice() {
  const pass = localStorage.getItem(LS_VAULT_PASS);
  if (!pass) return false;
  try {
    const bundle = await fetchEncryptedSnapshot();
    const data = await decryptVaultBundle(bundle, pass);
    vaultPass = pass;
    vaultUnlocked = true;
    mountDashboard();
    setLockedUI(false);
    loadBalancesFromStorage();
    applySnapshotData(data);
    STATE.snapshotSource = 'vault-device';
    return true;
  } catch (e) {
    console.warn('Device unlock failed:', e.message);
    localStorage.removeItem(LS_VAULT_PASS);
    vaultUnlocked = false;
    setLockedUI(true);
    return false;
  }
}

function showUnlockModal(errMsg) {
  vaultUnlocked = false;
  setLockedUI(true);
  ensureUnlockOverlay();
  const err = document.getElementById('unlock-error');
  if (err) err.textContent = errMsg || '';
  const input = document.getElementById('unlock-pass');
  if (input) { input.value = ''; setTimeout(() => input.focus(), 50); }
}
function hideUnlockModal() {
  const err = document.getElementById('unlock-error');
  if (err) err.textContent = '';
}
async function submitUnlock() {
  const pass = (document.getElementById('unlock-pass')?.value || '').trim();
  const remember = !!document.getElementById('unlock-remember')?.checked;
  const err = document.getElementById('unlock-error');
  const btn = document.getElementById('unlock-btn');
  if (!pass) { if (err) err.textContent = 'Enter your passphrase'; return; }
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    await unlockWithPassphrase(pass, remember);
  } catch (e) {
    console.warn(e);
    vaultUnlocked = false;
    setLockedUI(true);
    if (err) err.textContent = 'Wrong passphrase or corrupted vault file';
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Unlock'; }
}

function guardUnlockOverlay() {
  const tick = () => {
    if (vaultUnlocked) return;
    if (!document.body.classList.contains('locked')) document.body.classList.add('locked');
    ensureUnlockOverlay();
    const mount = document.getElementById('app-mount');
    if (mount && mount.childNodes.length) unmountDashboard();
    document.querySelectorAll('#app-shell, #modal-overlay').forEach(el => {
      if (!vaultUnlocked) el.remove();
    });
  };
  tick();
  new MutationObserver(tick).observe(document.documentElement, { subtree: true, childList: true, attributes: true });
  setInterval(tick, 500);
  document.addEventListener('keydown', e => {
    if (!vaultUnlocked && e.key === 'Escape') e.preventDefault();
  });
}

function isIncomeTx(t) { return t.type === 'Income' || (+t.amount || 0) > 0; }
function isExpenseTx(t) { return !isIncomeTx(t) && t.category !== 'Month progress bar'; }

function deriveSavingsFromTransactions(txs) {
  if (!(STATE.peaMonthly > 0) && STATE.monthlyCostBasis > 0) derivePeaMonthlyFromFinary();
  const peaMo = STATE.peaMonthly > 0 ? STATE.peaMonthly : 0;
  const monthly = {};
  txs.forEach(t => {
    const k = t.date.getFullYear() + '-' + String(t.date.getMonth() + 1).padStart(2, '0');
    if (!monthly[k]) monthly[k] = { inc: 0, exp: 0, label: '' };
    monthly[k].label = String(t.date.getMonth() + 1).padStart(2, '0') + '/' + String(t.date.getFullYear()).slice(2);
    if (t.amount > 0) monthly[k].inc += t.amount;
    else monthly[k].exp += Math.abs(t.amount);
  });
  return Object.entries(monthly)
    .sort((a, b) => b[0].localeCompare(a[0]))
    .slice(0, 12)
    .map(([key, m]) => {
      const net = Math.round(m.inc - m.exp);
      return { date: m.label || key, saved: net, pea: peaMo, cash: Math.round(net - peaMo), inc: Math.round(m.inc), exp: Math.round(m.exp) };
    });
}

async function fetchSavings() {

}

function netWorth() {
  return (STATE.pea || 0) + (STATE.livretA || 0) + (STATE.pee || 0) + (STATE.checking || 0);
}

  const nw = netWorth();

function monthBucket(txs) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  return txs.filter(t =>
    t.date.getFullYear() === y && t.date.getMonth() === m &&
    t.category !== 'Month progress bar' && t.category !== 'Month progress bar compensation'
  );
}

function renderCashflow(txs) {
  const month = monthBucket(txs);
  const incomeTxs = month.filter(isIncomeTx);
  const inc = incomeTxs.reduce((s, t) => s + Math.abs(+t.amount || 0), 0);
  const exp = month.filter(isExpenseTx).reduce((s, t) => s + Math.abs(t.amount), 0);
  const net = inc - exp;
  const elInc = document.getElementById('stat-inc');
  const elExp = document.getElementById('stat-exp');
  const elNet = document.getElementById('stat-net');
  elInc.textContent = fmt(inc);
  elExp.textContent = fmt(exp);
  elNet.textContent = (net >= 0 ? '+' : '−') + fmt(net);
  elNet.className = 'stat-val blur-val ' + (net >= 0 ? 'pos' : 'neg');
  document.getElementById('cashflow-sub').textContent =
    `${month.length} movements · income broken down by category below`;

  const incByCat = {};
  incomeTxs.forEach(t => {
    const name = (t.category || 'Income').trim() || 'Income';
    incByCat[name] = (incByCat[name] || 0) + Math.abs(+t.amount || 0);
  });
  const incSorted = Object.entries(incByCat).sort((a, b) => b[1] - a[1]);
  const incEl = document.getElementById('inc-breakdown');
  if (incEl) {
    incEl.innerHTML = incSorted.length
      ? `<div class="inc-section-lbl">Income detail</div>` +
        incSorted.map(([name, amt]) =>
          `<div class="inc-chip"><span>${name}</span><strong class="blur-val">+${fmt(amt)}</strong></div>`
        ).join('')
      : '<p style="color:var(--muted);font-size:13px">No income logged this month.</p>';
  }

  const cats = {};
  month.filter(isExpenseTx).forEach(t => {
    cats[t.category || 'Other'] = (cats[t.category || 'Other'] || 0) + Math.abs(t.amount);
  });
  const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const max = sorted[0]?.[1] || 1;
  document.getElementById('cat-bars').innerHTML = sorted.length
    ? `<div class="inc-section-lbl" style="margin-bottom:4px">Spend by category</div>` +
      sorted.map(([name, amt]) => `
      <div class="cat-row">
        <span class="cat-name" title="${name}">${name}</span>
        <div class="cat-track"><div class="cat-fill" style="width:${Math.round(amt / max * 100)}%"></div></div>
        <span class="cat-amt blur-val">${fmt(amt)}</span>
      </div>`).join('')
    : '<p style="color:var(--muted);font-size:13px">No expenses this month yet.</p>';

  const rows = txs
    .filter(t => t.category !== 'Month progress bar' && t.category !== 'Month progress bar compensation')
    .slice(0, 15);
  document.getElementById('feed-count').textContent = rows.length ? `${rows.length} recent` : '';
  const today = new Date().toDateString();
  document.getElementById('expense-list').innerHTML = rows.map(t => {
    const income = isIncomeTx(t);
    const ds = t.date.toDateString() === today ? 'Today'
      : t.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    return `<div class="feed-item">
      <div>
        <div class="feed-cat">${t.category || (income ? 'Income' : 'Expense')}</div>
        <div class="feed-meta">${[t.memo || null, ds].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="feed-amt ${income ? 'inc' : 'exp'} blur-val">${income ? '+' : '−'}${fmt2(t.amount)}</div>
    </div>`;
  }).join('') || '<p style="color:var(--muted);font-size:13px;padding:12px 0">No movements.</p>';
}

function setProjMode(mode) {
  projMode = mode;
  ['gross', 'net', 'both'].forEach(m => {
    const el = document.getElementById('tog-' + m);
    if (el) el.classList.toggle('on', m === mode);
  });
  drawTrajectory();
}

function buildContributionSeries() {
  const contribs = (STATE.peaContributions || [])
    .filter(c => c.date && c.amount != null)
    .map(c => ({ date: new Date(c.date), amount: +c.amount }))
    .filter(c => !isNaN(+c.date))
    .sort((a, b) => a.date - b.date);
  let cum = 0;
  const points = contribs.map(c => {
    cum += c.amount;
    return { date: c.date, funded: cum, value: null };
  });
  if (STATE.pea && points.length) {
    points.push({ date: new Date(), funded: cum, value: STATE.pea });
  } else if (STATE.pea) {
    points.push({ date: new Date(), funded: STATE.monthlyCostBasis || 0, value: STATE.pea });
  }
  return points;
}

function projectPea(years = 10, annualRate = 0.07) {
  const monthly = STATE.peaMonthly > 0 ? STATE.peaMonthly : 700;
  const r = annualRate / 12;
  let value = STATE.pea || 0;
  let cost = STATE.monthlyCostBasis || 0;
  const startYears = yearsHeld(STATE.peaStartedAt);
  // Net always models withdrawal after the 5-year mark (PS 17.2% on gain).
  const out = [{ year: 0, gross: value, net: peaNetAfter5y(value, cost).net, cost }];
  for (let y = 1; y <= years; y++) {
    for (let m = 0; m < 12; m++) {
      value = value * (1 + r) + monthly;
      cost += monthly;
    }
    const est = peaNetAfter5y(value, cost);
    out.push({ year: y, gross: value, net: est.net, cost, regime: est.regime });
  }
  return out;
}

function drawTrajectory() {
  const canvas = document.getElementById('trajChart');
  if (!canvas) return;
  if (charts.traj) { charts.traj.destroy(); delete charts.traj; }

  const hist = buildContributionSeries();
  const proj = projectPea(10, 0.07);
  const histLabels = hist.map(p => p.date.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }));
  const funded = hist.map(p => Math.round(p.funded));
  const liveVal = hist.map(p => p.value != null ? Math.round(p.value) : null);

  const projLabels = proj.map(p => p.year === 0 ? 'Now' : '+' + p.year + 'y');
  const gross = proj.map(p => Math.round(p.gross));
  const net = proj.map(p => Math.round(p.net));

  const labels = histLabels.concat(projLabels.slice(1));
  const padHist = (arr) => arr.concat(Array(proj.length - 1).fill(null));
  const padProj = (arr) => Array(Math.max(0, hist.length - 1)).fill(null).concat(arr);

  const datasets = [
    {
      label: 'Versements (cumul)',
      data: padHist(funded),
      borderColor: '#6b7c8f',
      backgroundColor: 'transparent',
      borderWidth: 1.5,
      borderDash: [4, 4],
      pointRadius: 0,
      tension: 0.25,
    },
  ];
  if (liveVal.some(v => v != null)) {
    datasets.push({
      label: 'PEA today',
      data: padHist(liveVal),
      borderColor: '#d4e3ff',
      backgroundColor: 'rgba(126,160,211,0.12)',
      borderWidth: 2.5,
      pointRadius: 3,
      pointBackgroundColor: '#e8c46a',
      tension: 0.3,
      spanGaps: true,
    });
  }
  if (projMode === 'gross' || projMode === 'both') {
    datasets.push({
      label: 'Projected gross',
      data: padProj(gross),
      borderColor: '#7ea0d3',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.25,
      spanGaps: true,
    });
  }
  if (projMode === 'net' || projMode === 'both') {
    datasets.push({
      label: 'Net after 5y',
      data: padProj(net),
      borderColor: '#e8c46a',
      borderWidth: 2,
      borderDash: projMode === 'both' ? [6, 4] : undefined,
      pointRadius: 0,
      tension: 0.25,
      spanGaps: true,
    });
  }

  charts.traj = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { color: '#8b9aab', font: { size: 11, family: 'Plus Jakarta Sans' }, boxWidth: 12 } },
        tooltip: { callbacks: { label: c => fmtTip(c.dataset.label, c.raw) } },
      },
      scales: {
        x: { ticks: { color: '#8b9aab', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { display: false } },
        y: { ticks: { callback: v => fmtAxis(v), color: '#8b9aab', font: { size: 10 } }, grid: { color: 'rgba(126,160,211,0.08)' } },
      },
    },
  });

  const held = yearsHeld(STATE.peaStartedAt);
  const y5 = proj.find(p => (held + p.year) >= 5) || proj[proj.length - 1];
  document.getElementById('traj-note').textContent =
    `Assumes ~${fmt(STATE.peaMonthly || 700)}/mo and 7% annualized. Net = after 5-year mark (PS 17.2% on gain only) — illustrative, not advice. ` +
    (STATE.peaStartedAt
      ? `Opened ${STATE.peaStartedAt}. At +${y5.year}y projected gross ~${fmt(y5.gross)}, net after 5y ~${fmt(y5.net)}.`
      : '');
}

function updateStatus() {
  const now = new Date();
  const snapAge = STATE.lastSnapshotSync ? new Date(STATE.lastSnapshotSync) : null;
  const el = document.getElementById('sync-time');
  if (el) {
    el.textContent = [
      'Updated ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),
      snapAge ? ('snapshot ' + snapAge.toLocaleString('en-GB')) : null,
    ].filter(Boolean).join(' · ');
  }
  const balAge = STATE.balanceDate ? new Date(STATE.balanceDate) : null;
  const balStaleDays = balAge ? ((now - balAge) / 86400000) : Infinity;
  const balStale = balStaleDays > 7;
  const balLabel = !STATE.finaryOk ? 'Finary ✗' : balStale ? `Finary ⚠ ${Math.floor(balStaleDays)}d` : 'Finary ✓';
  const driveTitle = STATE.driveOk
    ? `Via ${STATE.snapshotSource || '?'} · ${STATE.lastSnapshotSync ? new Date(STATE.lastSnapshotSync).toLocaleString() : 'OK'}`
    : (STATE.snapshotFetchError || 'Could not load snapshot');
  const bar = document.getElementById('status-bar');
  if (!bar) return;
  bar.innerHTML = [
    `<span class="pill ${STATE.driveOk ? 'pill-ok' : 'pill-err'}" title="${driveTitle}">${STATE.driveOk ? 'Data ✓' : 'Data ✗'}</span>`,
    `<span class="pill ${STATE.finaryOk && !balStale ? 'pill-ok' : 'pill-err'}">${balLabel}</span>`,
    `<span class="pill ${STATE.savingsOk ? 'pill-ok' : 'pill-err'}">${STATE.savingsOk ? 'Wallet ✓' : 'Wallet ✗'}</span>`,
    `<span class="pill">${STATE.transactions.length} tx</span>`,
  ].join('');
}

function renderAll(txs) {
  renderHero();
  renderCashflow(txs || []);
  drawTrajectory();
  updateStatus();
}

function getExportWebAppUrl() {
  return (localStorage.getItem(LS_EXPORT_URL) || '').trim().replace(/\/$/, '');
}

function jsonpRequest(url, timeoutMs = 120000) {
  return new Promise((resolve, reject) => {
    const cb = '_wdCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const script = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => finish(new Error('Apps Script timeout — export can take up to ~90s')), timeoutMs);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (_) { window[cb] = undefined; }
      script.remove();
    }
    function finish(err, data) {
      if (settled) return;
      settled = true;
      cleanup();
      if (err) reject(err);
      else resolve(data);
    }
    window[cb] = (data) => finish(null, data);
    script.onerror = () => finish(new Error('Apps Script script load failed'));
    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + encodeURIComponent(cb) + '&t=' + Date.now();
    document.head.appendChild(script);
  });
}

async function fetchLiveSnapshotFromAppsScript() {
  const base = getExportWebAppUrl();
  if (!base) throw new Error('No Apps Script URL — set it in Settings');
  const url = base + (base.includes('?') ? '&' : '?') + 'full=1';
  const data = await jsonpRequest(url, 120000);
  if (!data || data.ok === false) throw new Error((data && data.error) || 'Apps Script error');
  if (!Array.isArray(data.transactions)) throw new Error('Apps Script response missing transactions');
  return data;
}

async function refreshAll() {
  if (!vaultUnlocked) { showUnlockModal(); return; }
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  if (btn) btn.classList.add('refreshing');
  if (icon) { icon.className = 'spin'; icon.textContent = '↻'; }
  const status = document.getElementById('status-bar');

  if (!getExportWebAppUrl()) {
    if (btn) btn.classList.remove('refreshing');
    if (icon) { icon.className = ''; icon.textContent = '↻'; }
    if (status) status.innerHTML = `<span class="pill pill-err">Set Apps Script URL in Settings for live Refresh</span>`;
    showBalanceModal();
    return;
  }

  if (status) status.innerHTML = `<span class="pill pill-load">Rebuilding from Drive + Finary…</span>`;
  try {
    const data = await fetchLiveSnapshotFromAppsScript();
    applySnapshotData(data);
    STATE.snapshotSource = 'apps-script-live';
    STATE.driveOk = true;
    await fetchSavings();
    renderAll(STATE.transactions);
    if (status) status.innerHTML = [
      `<span class="pill pill-ok">Live sync ✓</span>`,
      `<span class="pill ${STATE.finaryOk ? 'pill-ok' : 'pill-err'}">${STATE.finaryOk ? 'Finary ✓' : 'Finary ✗'}</span>`,
      `<span class="pill">${STATE.transactions.length} tx</span>`,
    ].join('');
    generateAiSummary(STATE.transactions, true).catch(() => {});
  } catch (e) {
    const msg = e.message || String(e);
    console.warn('Live refresh failed:', msg);
    if (status) status.innerHTML = `<span class="pill pill-err" title="${msg.replace(/"/g, '&quot;')}">Live sync failed: ${msg}</span>`;
  }
  if (btn) btn.classList.remove('refreshing');
  if (icon) { icon.className = ''; icon.textContent = '↻'; }
}

function renderAiHtml(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/\n/g, '<br>');
}

function aiCacheKey() { return 'dashboard_ai_brief_v2'; }
function getAiCache() {
  try { return JSON.parse(localStorage.getItem(aiCacheKey()) || 'null'); } catch { return null; }
}
function setAiCache(text) {
  try { localStorage.setItem(aiCacheKey(), JSON.stringify({ text, at: Date.now() })); } catch {}
}

async function generateAiSummary(txs, force = false) {
  if (aiGenerating) return;
  const el = document.getElementById('ai-body');
  if (!el) return;
  const cached = getAiCache();
  if (!force && cached && (Date.now() - cached.at) < 86400000) {
    el.innerHTML = renderAiHtml(cached.text);
    return;
  }
  aiGenerating = true;
  const btn = document.getElementById('ai-refresh-btn');
  if (btn) { btn.textContent = '…'; btn.disabled = true; }
  el.innerHTML = `<span class="ai-loading">Generating brief…</span>`;

  const tax = peaNetAfter5y(STATE.pea, STATE.monthlyCostBasis);
  const heldYrs = yearsHeld(STATE.peaStartedAt);
  const month = monthBucket(txs || []);
  const exp = month.filter(isExpenseTx).reduce((s, t) => s + Math.abs(t.amount), 0);
  const inc = month.filter(isIncomeTx).reduce((s, t) => s + Math.abs(+t.amount || 0), 0);
  const local = `**${fmt(netWorth())} net — PEA ${fmt(STATE.pea)} (~${fmt(tax.net)} after 5y)**\n- Gain ${fmt(tax.gain)} · PS 17.2% after 5y · ${heldYrs.toFixed(1)}y held so far\n- This month: income ${fmt(inc)} / spend ${fmt(exp)}\n- Livret A ${fmt(STATE.livretA)} · PEE ${fmt(STATE.pee || 0)}\n- **Today:** keep the ~${fmt(STATE.peaMonthly || 700)} PEA DCA and watch spend pace vs income`;
  const apiKey = (localStorage.getItem(LS_GEMINI) || '').trim();

  const finishLocal = () => { el.innerHTML = renderAiHtml(local); setAiCache(local); };

  if (!apiKey) {
    finishLocal();
    aiGenerating = false;
    if (btn) { btn.textContent = '↻'; btn.disabled = false; }
    return;
  }

  try {
    const prompt = `Short personal-finance brief for Rostom. English, punchy. Bold key €. 1 headline + 4 bullets + one Today's action. PEA net figures are after the 5-year mark (PS 17.2% on gain), not early withdrawal.\nNW ${netWorth()} PEA ${STATE.pea} cost ${STATE.monthlyCostBasis} netPEA_after5y ${tax.net} livret ${STATE.livretA} pee ${STATE.pee} monthInc ${inc} monthExp ${exp} peaMo ${STATE.peaMonthly}`;
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.55, maxOutputTokens: 500 },
      }),
    });
    if (!res.ok) throw new Error('Gemini HTTP ' + res.status);
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
    if (!text.trim()) throw new Error('empty');
    el.innerHTML = renderAiHtml(text.trim());
    setAiCache(text.trim());
  } catch (e) {
    console.warn('Gemini failed:', e.message);
    finishLocal();
  }
  aiGenerating = false;
  if (btn) { btn.textContent = '↻'; btn.disabled = false; }
}

async function forceAiRefresh() {
  if (!vaultUnlocked) { showUnlockModal(); return; }
  await generateAiSummary(STATE.transactions, true);
}

(async () => {
  vaultUnlocked = false;
  clearSensitiveState();
  setLockedUI(true);
  guardUnlockOverlay();
  const ok = await tryUnlockFromDevice();
  if (ok) {
    await fetchSavings();
    renderAll(STATE.transactions);
    generateAiSummary(STATE.transactions, false).catch(() => {});
  } else {
    clearSensitiveState();
    showUnlockModal();
  }
})();
</script>
