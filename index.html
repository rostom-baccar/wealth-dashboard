let aiRequestSerial = 0;
const LS_GEMINI_COOLDOWN = 'gemini_quota_cooldown_until';
const GEMINI_QUOTA_COOLDOWN_MS = 45 * 60 * 1000;

function isGeminiQuotaError(err) {
  const status = err && err.status;
  const msg = String((err && err.message) || '');
  // Google wording varies: "exceeded your current quota", "quota exceeded", RESOURCE_EXHAUSTED, 429.
  return status === 429 || /RESOURCE_EXHAUSTED|quota|rate.?limit|billing details/i.test(msg);
}

function isGeminiFatalError(err) {
  const status = err && err.status;
  const msg = String((err && err.message) || '');
  if (status === 401 || status === 403 || status === 429) return true;
  if (isGeminiQuotaError(err)) return true;
  if (status === 400 && /api[_ ]?key|API_KEY|invalid|permission|CONSUMER|expired/i.test(msg)) return true;
  return false;
}

function getGeminiCooldownUntil() {
  try { return +localStorage.getItem(LS_GEMINI_COOLDOWN) || 0; } catch { return 0; }
}
function setGeminiCooldown(ms = GEMINI_QUOTA_COOLDOWN_MS) {
  try { localStorage.setItem(LS_GEMINI_COOLDOWN, String(Date.now() + ms)); } catch (_) {}
}
function clearGeminiCooldown() {
  try { localStorage.removeItem(LS_GEMINI_COOLDOWN); } catch (_) {}
}
function geminiCooldownRemainingMin() {
  return Math.max(1, Math.ceil((getGeminiCooldownUntil() - Date.now()) / 60000));
}

function categoryTotals(txs) {
  const map = {};
  (txs || []).filter(isExpenseTx).forEach(t => {
    const c = t.category || 'Other';
    map[c] = (map[c] || 0) + Math.abs(+t.amount || 0);
  });
  return Object.entries(map)
    .map(([name, amount]) => ({ name, amount }))
    .sort((a, b) => b.amount - a.amount);
}

function prevMonthBucket(txs) {
  const now = new Date();
  const y = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
  const m = now.getMonth() === 0 ? 11 : now.getMonth() - 1;
  return (txs || []).filter(t =>
    t.date.getFullYear() === y && t.date.getMonth() === m &&
    t.category !== 'Month progress bar' && t.category !== 'Month progress bar compensation'
  );
}

function mapTxShort(t) {
  return {
    date: localDayStr(t.date),
    category: t.category || 'Other',
    amount: Math.round(Math.abs(+t.amount || 0) * 100) / 100,
    memo: (t.memo || '').trim(),
  };
}

function buildCheckinDossier(txs) {
  const all = txs || [];
  const tax = peaNetAfter5y(STATE.pea, STATE.monthlyCostBasis);
  const heldYrs = yearsHeld(STATE.peaStartedAt);
  const month = monthBucket(all);
  const prev = prevMonthBucket(all);
  const expenses = month.filter(isExpenseTx);
  const exp = expenses.reduce((s, t) => s + Math.abs(t.amount), 0);
  const inc = month.filter(isIncomeTx).reduce((s, t) => s + Math.abs(+t.amount || 0), 0);
  const prevExp = prev.filter(isExpenseTx).reduce((s, t) => s + Math.abs(t.amount), 0);
  const prevInc = prev.filter(isIncomeTx).reduce((s, t) => s + Math.abs(+t.amount || 0), 0);
  const pace = expectedPeaThisMonth(all);
  const boosts = computeBoosts(all);
  const hero = boosts.hero && !boosts.hero.pending ? boosts.hero : null;
  const livretGap = Math.max(0, LIVRET_TARGET - (STATE.livretA || 0));
  const saved = inc - exp;

  const catNow = categoryTotals(month);
  const catPrevMap = Object.fromEntries(categoryTotals(prev).map(c => [c.name, c.amount]));

  const rawBudgets = (STATE.budgets || []).filter(b => b.name && !/month progress/i.test(b.name));
  const budgetedCatSet = new Set();
  rawBudgets.forEach(b => (b.categories || []).forEach(c => budgetedCatSet.add(c)));

  const unusualCats = catNow.map(c => {
    const prevAmt = catPrevMap[c.name] || 0;
    const delta = c.amount - prevAmt;
    const ratio = prevAmt > 0 ? c.amount / prevAmt : (c.amount > 25 ? 99 : 1);
    const unbudgeted = !budgetedCatSet.has(c.name) || /out of budget/i.test(c.name);
    return { ...c, prevAmt, delta, ratio, unbudgeted };
  }).filter(c => {
    if (c.amount < 25) return false;
    // Always keep unbudgeted / “Out of budget” once material — MoM can look “normal” while memos tell the story.
    if (c.unbudgeted && c.amount >= 40) return true;
    return c.ratio >= 1.35 || c.delta >= 50 || !catPrevMap[c.name];
  })
    .sort((a, b) => (Number(b.unbudgeted) - Number(a.unbudgeted)) || (b.delta - a.delta) || (b.amount - a.amount))
    .slice(0, 12);

  const budgetRows = rawBudgets
    .map(b => {
      const cats = b.categories || [];
      const matched = [];
      let spent = 0;
      if (cats.length) {
        const set = new Set(cats);
        expenses.forEach(t => {
          if (set.has(t.category)) {
            spent += Math.abs(+t.amount || 0);
            matched.push(mapTxShort(t));
          }
        });
      } else {
        // Catch-all bucket (often “Misc” / out-of-budget): txs whose category isn’t in any other budget.
        expenses.forEach(t => {
          const cat = t.category || 'Other';
          if (!budgetedCatSet.has(cat)) {
            spent += Math.abs(+t.amount || 0);
            matched.push(mapTxShort(t));
          }
        });
      }
      const limit = +b.amount || 0;
      return {
        name: b.name,
        categories: cats,
        catchAll: !cats.length,
        spent: Math.round(spent),
        limit: Math.round(limit),
        over: limit > 0 ? Math.max(0, Math.round(spent - limit)) : 0,
        pct: limit > 0 ? Math.round(spent / limit * 100) : null,
        sampleTx: matched
          .sort((a, b) => b.amount - a.amount)
          .slice(0, 12),
      };
    })
    .sort((a, b) => (b.over - a.over) || (b.pct || 0) - (a.pct || 0));

  const overBudgetRows = budgetRows.filter(b => b.over > 0);
  const overBudgetCats = new Set(overBudgetRows.flatMap(b => b.categories || []));
  const overCatchAll = overBudgetRows.some(b => b.catchAll);

  // Categories that never appear on any budget (e.g. Wallet “Out of budget”) — often where life events land.
  const unbudgetedCats = catNow
    .filter(c => !budgetedCatSet.has(c.name))
    .map(c => ({
      name: c.name,
      eur: Math.round(c.amount),
      lastMonthEur: Math.round(catPrevMap[c.name] || 0),
      txCount: expenses.filter(t => (t.category || 'Other') === c.name).length,
    }));

  const isUnbudgetedTx = (t) => {
    const cat = t.category || 'Other';
    if (!budgetedCatSet.has(cat)) return true;
    if (/out of budget/i.test(cat)) return true;
    return false;
  };

  // Memos + over-budget + unbudgeted lines matter more than the single largest rent payment.
  const memoExpenses = expenses
    .filter(t => (t.memo || '').trim())
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 50)
    .map(mapTxShort);

  const overBudgetExpenses = expenses
    .filter(t => overBudgetCats.has(t.category) || (overCatchAll && !budgetedCatSet.has(t.category || 'Other')))
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 30)
    .map(mapTxShort);

  const unbudgetedRaw = expenses.filter(isUnbudgetedTx);
  const unbudgetedSpendTotal = unbudgetedRaw.reduce((s, t) => s + Math.abs(+t.amount || 0), 0);
  const unbudgetedExpenses = unbudgetedRaw
    .slice()
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 35)
    .map(mapTxShort);

  const topExpenses = expenses
    .slice()
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 20)
    .map(mapTxShort);

  // Full-ish month feed so life events in mid-size categories are visible even without memos.
  const allExpensesThisMonth = expenses
    .slice()
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 60)
    .map(mapTxShort);

  const incomeTxs = month.filter(isIncomeTx);
  const recentIncome = incomeTxs
    .slice()
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 12)
    .map(mapTxShort);

  const incomeWithMemos = incomeTxs
    .filter(t => (t.memo || '').trim())
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 20)
    .map(mapTxShort);

  // Compact anchors: any labeled money movement the model must not skip.
  const labeledAnchors = [...expenses, ...incomeTxs]
    .filter(t => (t.memo || '').trim())
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))
    .slice(0, 25)
    .map(t => ({
      ...mapTxShort(t),
      direction: isIncomeTx(t) ? 'in' : 'out',
    }));

  const holdings = (STATE.peaAlloc || []).map(h => {
    const value = +h.value || 0, shares = +h.shares || 0, pxCost = +h.costBasis || 0;
    const cost = shares * pxCost, gain = value - cost;
    return {
      name: h.name || 'ETF',
      value: Math.round(value),
      gain: Math.round(gain),
      pct: cost > 0 ? +(gain / cost * 100).toFixed(1) : null,
      weight: h.pct != null ? +h.pct : null,
    };
  });

  const livretWd = livretWithdrawals().slice(0, 6).map(w => ({
    date: localDayStr(w.date),
    amount: Math.round(w.amount),
    balance: Math.round(w.balance),
  }));

  // Prefer the same hero-window split shown on screen; fall back to calendar-month residual.
  const perfSplit = boosts.perfSplit || computeWealthPerfSplit(hero, all);
  const wealthDelta = perfSplit ? perfSplit.wealthDelta : (hero ? Math.round(hero.amount) : null);
  const controllable = perfSplit ? perfSplit.controllable : Math.round(saved);
  const residualVsCashflow = wealthDelta != null ? Math.round(wealthDelta - controllable) : null;
  const portfolioLikelyDominant = wealthDelta != null
    && Math.abs(wealthDelta) >= Math.max(250, Math.abs(controllable) * 1.25)
    && Math.abs(residualVsCashflow) >= Math.abs(controllable);

  return {
    today: localDayStr(new Date()),
    heroVsMode,
    tax, heldYrs, exp, inc, prevExp, prevInc, pace, hero, livretGap, boosts,
    perfSplit,
    catNow: catNow.slice(0, 14),
    unusualCats,
    topExpenses,
    memoExpenses,
    overBudgetExpenses,
    unbudgetedCats,
    unbudgetedExpenses,
    allExpensesThisMonth,
    recentIncome,
    incomeWithMemos,
    labeledAnchors,
    budgetRows,
    holdings,
    livretWd,
    wealthDecomposition: {
      wealthDeltaEur: wealthDelta,
      wealthDeltaPct: hero && hero.pct != null ? +hero.pct.toFixed(2) : null,
      vs: hero?.baseline?.label || perfSplit?.windowLabel || null,
      baselineWhen: hero?.baseline?.when || perfSplit?.windowWhen || null,
      note: 'controllablePerfEur = wallet income−spend over the same hero comparison window (what he controls). nonControllablePerfEur = wealth delta minus that (mostly PEA mark-to-market / revaluations). householdNetThisMonthEur remains calendar-month only.',
      controllablePerfEur: controllable,
      nonControllablePerfEur: residualVsCashflow,
      householdNetThisMonthEur: Math.round(saved),
      incomeThisMonthEur: Math.round(inc),
      spendThisMonthEur: Math.round(exp),
      unbudgetedSpendThisMonthEur: Math.round(unbudgetedSpendTotal),
      residualLikelyMarkToMarketOrOtherEur: residualVsCashflow,
      portfolioMoveLikelyDominatesWealthChange: portfolioLikelyDominant,
      reading: portfolioLikelyDominant
        ? 'Non-controllable (markets/revaluations) dominates the wealth move — lead with PEA mark-to-market; treat wallet saving as secondary colour.'
        : 'Controllable wallet cashflow explains a meaningful share of the wealth move; still mention markets if nonControllablePerfEur is material.',
    },
    accounts: {
      netWorth: Math.round(netWorth()),
      pea: Math.round(STATE.pea || 0),
      peaCostBasis: Math.round(STATE.monthlyCostBasis || 0),
      peaGain: Math.round((STATE.pea || 0) - (STATE.monthlyCostBasis || 0)),
      peaNetAfter5y: Math.round(tax.net),
      peaMonthly: Math.round(STATE.peaMonthly || 700),
      peaStartedAt: STATE.peaStartedAt || null,
      heldYears: +heldYrs.toFixed(2),
      livretA: Math.round(STATE.livretA || 0),
      livretFloor: LIVRET_TARGET,
      livretGap: Math.round(livretGap),
      pee: Math.round(STATE.pee || 0),
      checking: STATE.checking != null ? Math.round(STATE.checking) : null,
      boursoLddsStaging: STATE.boursoLdds != null ? Math.round(STATE.boursoLdds) : null,
      balanceDate: STATE.balanceDate || null,
    },
  };
}

function localCheckinText(ctx) {
  const nw = ctx.accounts.netWorth;
  const hero = ctx.hero;
  const decomp = ctx.wealthDecomposition;
  const open = hero
    ? (hero.amount < 0
      ? `You're down **${fmtDelta(hero.amount, hero.pct)}** vs ${hero.baseline?.label || 'last period'}${hero.baseline?.when ? ` (${hero.baseline.when})` : ''}, at **${fmt(nw)}**.`
      : `You're up **${fmtDelta(hero.amount, hero.pct)}** vs ${hero.baseline?.label || 'last period'}${hero.baseline?.when ? ` (${hero.baseline.when})` : ''}, at **${fmt(nw)}**.`)
    : `Net worth is **${fmt(nw)}** — still building a clean comparison baseline.`;

  const youAmt = decomp.controllablePerfEur;
  const mktAmt = decomp.nonControllablePerfEur;
  const marketBit = (youAmt != null && mktAmt != null)
    ? ` Of that, **you** (controllable wallet net) are at **${fmtDelta(youAmt, null)}**, and **markets** (non-controllable) at **${fmtDelta(mktAmt, null)}**.`
    : ` This month’s household net is **${fmt(decomp.householdNetThisMonthEur)}** (**${fmt(ctx.inc)}** in / **${fmt(ctx.exp)}** out).`;

  const memoHits = (ctx.labeledAnchors || []).slice(0, 5);
  const over = ctx.budgetRows.filter(b => b.over > 0).slice(0, 3);
  const unb = (ctx.unbudgetedCats || []).slice(0, 2);
  const lifeBit = (memoHits.length || over.length || unb.length)
    ? ` On the personal side, ${[
        unb.length ? `unbudgeted buckets include ${unb.map(c => `**${c.name}** (${fmt(c.eur)})`).join(', ')}` : null,
        memoHits.length ? `labeled movements include ${memoHits.map(t => `“${t.memo}” (${fmt(t.amount)} · ${t.category})`).join('; ')}` : null,
        over.length ? `budgets show pressure in ${over.map(b => `**${b.name}** (+${fmt(b.over)})`).join(', ')}` : null,
      ].filter(Boolean).join(', and ')}.`
    : '';

  const keep = ctx.livretGap > 0
    ? ` Keep the ~${fmt(ctx.accounts.peaMonthly)}/mo PEA habit, and top Livret toward the €8k floor before sending extra staging over.`
    : ` Keep the ~${fmt(ctx.accounts.peaMonthly)}/mo PEA habit and let month-end staging roll into the PEA while Livret stays at the floor.`;

  const why = ctx._offlineReason === 'quota'
    ? 'Live AI is paused — Gemini quota/rate limit hit (key is fine; free tier or plan cap). Numbers above are still from your wallet.'
    : ctx._offlineReason === 'cooldown'
      ? 'Live AI is on a short cooldown after a quota hit — not calling Gemini again yet.'
      : 'This is the offline fallback (Gemini didn’t run).';

  return `${open}${marketBit}${lifeBit}\n\n${why} **Next:**${keep}`;
}

function buildCheckinPrompt(ctx) {
  const hero = ctx.hero;
  const wealthLine = hero
    ? `HE IS CURRENTLY SEEING on screen: wealth ${hero.amount >= 0 ? 'UP' : 'DOWN'} by ${Math.round(hero.amount)} EUR (${hero.pct != null ? hero.pct.toFixed(1) + '%' : 'n/a'}) versus ${hero.baseline?.label || 'prior'}${hero.baseline?.when ? ' (baseline ' + hero.baseline.when + ')' : ''}. Mode=${ctx.heroVsMode}.`

  }

  return [
    'You are Rostom’s personal wealth check-in writer — a thoughtful friend who inspected his dossier and, when useful, recent public market/news context. Warm, specific, adult. Not a coach bot.',

    '- 2 short paragraphs of continuous prose (optional tiny third for the next step). NO bullets, NO numbered lists, NO headings, NO emoji.',

    '- Also skim expensesWithMemos, budgets[].sampleTx, and allExpensesThisMonth for supporting colour.',

    '- Empathize when the month was noisy; reinforce good habits (DCA, Livret floor). End with one concrete next move.',

    '',
    wealthLine,
    '',
    'PRIVATE DOSSIER JSON:',
    dossierJson,
  ].join('\n');
}

const GEMINI_CHECKIN_MODELS = [
  'gemini-2.5-flash',
  'gemini-2.0-flash',
  'gemini-flash-latest',
];

function extractGeminiText(data) {
  const parts = data?.candidates?.[0]?.content?.parts;
  if (!Array.isArray(parts)) return '';
  // Gemini 2.5+ may return thought summaries alongside the answer — never show those.
  return parts
    .filter(p => p && p.thought !== true && typeof p.text === 'string' && p.text.trim())
    .map(p => p.text)
    .join('')
    .trim();
}

async function callGeminiCheckin(apiKey, prompt, { withSearch = true, model } = {}) {
  const modelId = model || GEMINI_CHECKIN_MODELS[0];
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.65,
      maxOutputTokens: 1024,
    },
  };
  // 2.5 Flash thinking can eat the output budget; zero it so we only get the final prose.
  // Older Flash models reject thinkingConfig — omit for them.
  if (/2\.5/.test(modelId)) {
    body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
  }
  // REST JSON uses camelCase googleSearch (snake_case is ignored / rejected).
  if (withSearch) body.tools = [{ googleSearch: {} }];

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-goog-api-key': apiKey,
    },
    body: JSON.stringify(body),
  });
  const raw = await res.text();
  let data = null;
  try { data = JSON.parse(raw); } catch (_) {}
  if (!res.ok) {
    const msg = data?.error?.message || ('Gemini HTTP ' + res.status);
    const err = new Error(msg);
    err.status = res.status;
    err.body = data;
    err.model = modelId;
    throw err;
  }
  const text = extractGeminiText(data);
  if (!text) {
    const block = data?.candidates?.[0]?.finishReason || data?.promptFeedback?.blockReason || 'empty';
    const err = new Error('empty response (' + block + ')');
    err.status = res.status;
    err.model = modelId;
    throw err;
  }
  const grounded = !!(data?.candidates?.[0]?.groundingMetadata?.webSearchQueries?.length
    || data?.candidates?.[0]?.groundingMetadata?.groundingChunks?.length);
  return { text, model: modelId, grounded, data };
}

async function generateAiSummary(txs, force = false) {
  const el = document.getElementById('ai-body');
  if (!el) return;
  const cached = getAiCache();
  if (!force && cached && (Date.now() - cached.at) < 86400000) {
    el.innerHTML = renderAiHtml(cached.text);
    setCheckinStatus('Cached live check-in · tap Refresh check-in for a new read', 'ok');
    return;
  }

  const reqId = ++aiRequestSerial;
  aiGenerating = true;
  const btn = document.getElementById('ai-refresh-btn');
  if (btn) { btn.textContent = 'Refreshing…'; btn.disabled = true; }
  el.innerHTML = `<span class="ai-loading">Reading your numbers + recent context…</span>`;
  setCheckinStatus('Calling Gemini…', 'warn');

  const stillCurrent = () => reqId === aiRequestSerial;
  const ctx = buildCheckinDossier(txs);
  const apiKey = (localStorage.getItem(LS_GEMINI) || '').trim();
  const digest = `dossier ${ctx.unbudgetedCats?.length || 0} unbudgeted cat · ${ctx.labeledAnchors?.length || 0} labels · ${ctx.unbudgetedExpenses?.length || 0} out-of-band txs`;
  const errors = [];

  const finishLocal = (statusMsg, offlineReason = 'offline') => {
    if (!stillCurrent()) return;
    ctx._offlineReason = offlineReason;
    el.innerHTML = renderAiHtml(localCheckinText(ctx));
    setCheckinStatus(statusMsg || 'Offline template — add a Gemini API key in Settings for the real check-in', 'bad');
  };

  try {
    if (!apiKey) {
      finishLocal('No Gemini API key in Settings — showing offline template only', 'offline');
      return;
    }

    const coolUntil = getGeminiCooldownUntil();
    if (!force && coolUntil > Date.now()) {
      finishLocal(
        `Gemini cooldown ~${geminiCooldownRemainingMin()}m after quota — offline template · tap Refresh check-in to retry · ${digest}`,
        'cooldown'
      );
      return;
    }

    const prompt = buildCheckinPrompt(ctx);
    setCheckinStatus('Calling Gemini… · ' + digest, 'warn');

    let result = null;
    // Prefer grounded search; fall back across models, then plain generation.
    outer: for (const withSearch of [true, false]) {
      for (const model of GEMINI_CHECKIN_MODELS) {
        if (!stillCurrent()) break outer;
        try {
          result = await callGeminiCheckin(apiKey, prompt, { withSearch, model });
          break outer;
        } catch (e) {
          errors.push(`${model}${withSearch ? '+search' : ''}: ${e.message}`);
          console.warn('Gemini attempt failed:', model, withSearch, e.message);
          // Bad key / quota — don't hammer 5 more model variants.
          if (isGeminiFatalError(e)) throw e;
        }
      }
    }
    if (!stillCurrent()) {
      // Superseded by a newer refresh — do not touch UI.
    } else if (!result) {
      throw new Error(errors.slice(0, 3).join(' · ') || 'all attempts failed');
    } else if (/offline fallback|Gemini didn’t run|Gemini didn't run|Live AI is paused/i.test(result.text)) {
      throw new Error('model returned offline-template-like text');
    } else {
      clearGeminiCooldown();
      el.innerHTML = renderAiHtml(result.text);
      setAiCache(result.text, { source: 'ai' });
      setCheckinStatus(
        (result.grounded
          ? `Live AI · ${result.model} · Google Search grounding on`
          : `Live AI · ${result.model} · model knowledge (no search hits)`) + ' · ' + digest,
        'ok'
      );
    }
  } catch (e) {
    console.warn('Gemini check-in failed:', e.message, errors);
    if (isGeminiQuotaError(e)) {
      setGeminiCooldown();
      finishLocal(
        `Gemini quota/rate limit — offline template for ~${geminiCooldownRemainingMin()}m. Check plan/billing at aistudio.google.com · ${digest}`,
        'quota'
      );
    } else {
      finishLocal(
        `AI failed (${e.message || 'error'}) — offline template below. Check key in Settings. · ${digest}`,
        'offline'
      );
    }
  } finally {
    if (stillCurrent()) {
      aiGenerating = false;
      if (btn) { btn.textContent = 'Refresh check-in'; btn.disabled = false; }
    }
  }
}

async function forceAiRefresh() {
  if (!vaultUnlocked) { showUnlockModal(); return; }
  await generateAiSummary(STATE.transactions, true);
}

(async () => {
  vaultUnlocked = false;
  clearSensitiveState();
  setLockedUI(true);
  guardUnlockOverlay();
  const ok = await tryUnlockFromDevice();
  if (ok) {
    await fetchSavings();
    renderAll(STATE.transactions);
    generateAiSummary(STATE.transactions, false).catch(() => {});
  } else {
    clearSensitiveState();
    showUnlockModal();
  }
})();

</script>
